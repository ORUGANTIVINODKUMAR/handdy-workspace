services:
  - type: web
    name: handdy-workspace
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev --prefix backend && npm ci --include=dev --prefix dashboard && test -s dashboard/public/downloads/CRM-Setup.exe && test "$(stat -c%s dashboard/public/downloads/CRM-Setup.exe)" -gt 100000000 && npm run build --prefix dashboard
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AUTH_SESSION_LIFETIME_MS
        value: 604800000
      - key: AUTH_SESSION_OFFLINE_GRACE_MS
        value: 300000
      - key: LOGIN_REQUEST_LIFETIME_MS
        value: 120000
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: CORS_ORIGINS
        sync: false
      # Optional on Render because RENDER_EXTERNAL_URL is supplied automatically.
      # Set this explicitly when the dashboard uses a custom production domain.
      - key: FRONTEND_URL
        sync: false
